[project]
name = "nipah-rag-chatbot"
version = "0.1.0"
description = "RAG chatbot over WHO/ECDC Nipah virus guidance, with a layered LLM-as-judge evaluation suite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "llama-cloud>=2.8",
    "llama-index>=0.14.24",
    "llama-index-embeddings-huggingface>=0.8.0",
    "llama-index-vector-stores-faiss>=0.7.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[dependency-groups]
dev = ["pytest>=8"]
